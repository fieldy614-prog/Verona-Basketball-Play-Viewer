<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basketball Play Viewer</title><style>
 :root{font-family:Arial,Helvetica,sans-serif;color:#19212c;background:#f1f3f7}*{box-sizing:border-box}body{margin:0}header{background:#85001e;color:white;padding:15px 20px}header h1{font-size:clamp(20px,3vw,30px);margin:0}header p{margin:5px 0 0}.layout{max-width:1400px;margin:14px auto;padding:0 12px;display:grid;grid-template-columns:220px minmax(0,2fr) minmax(230px,1fr);gap:14px}.courtwrap,.notes{background:white;border:1px solid #d2d7e0;border-radius:12px;padding:12px}svg{width:100%;height:auto;display:block;background:#e9ad4d;border-radius:6px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{border:1px solid #aab2c1;border-radius:7px;background:white;padding:9px 13px;font-weight:bold;cursor:pointer}button.primary{background:#85001e;color:white}button:disabled{opacity:.4}.stepspanel h2,.notes h2{margin:4px 0 10px}.stepspanel{background:white;border:1px solid #d2d7e0;border-radius:12px;padding:12px}.stepitem{display:block;width:100%;text-align:left;margin:7px 0;padding:10px;background:#f5f6f9;border:1px solid #cbd0da;border-radius:8px}.stepitem.active{background:#f9e7ed;border:2px solid #85001e}.actionitem{font-size:12px;color:#414955;padding:4px 0 4px 8px}.viewerbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.notes h3{margin:14px 0 6px}.notes li{margin:7px 0;line-height:1.4}.coaching{white-space:pre-wrap;background:#f4f5f8;padding:9px;border-radius:6px}.small{font-size:13px;color:#555}#stepstatus{font-weight:bold;margin:10px 0}@media(max-width:1000px){.layout{grid-template-columns:200px minmax(0,1fr)}.notes{grid-column:1/-1}}@media(max-width:650px){.layout{grid-template-columns:1fr}.notes{grid-column:auto}}
 </style></head><body><header><h1 id="title"></h1><p>Basketball Play Viewer · Watch the animation and read the coaching notes</p></header><div class="layout"><aside class="stepspanel"><h2>Steps & Actions</h2><div id="steplist"></div></aside><section class="courtwrap"><svg id="court" viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg"><rect width="940" height="600" fill="#e9ad4d"/><g id="lines" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><g id="routes"/><g id="players"/></svg><div class="controls"><button id="previous">◀ Previous Step</button><button class="primary" id="play">▶ Play</button><button id="restart">↺ Restart</button><button id="next">Next Step ▶</button><button id="print">Print</button><button id="downloadviewer">Download Play</button></div><div id="stepstatus"></div><div class="small">Standalone viewer · No internet connection or editing software required.</div></section><aside class="notes"><h2>Play Instructions</h2><div id="instructions"></div></aside></div>
 <script>(async()=>{
async function loadPlayFromLink(){
const raw=location.hash.slice(1);if(!raw){document.body.innerHTML='<main style="font:18px Arial;padding:40px"><h1>Basketball Play Viewer</h1><p>No play was included in this link. Open a shared play link from your coach.</p></main>';throw Error('No play in link')}
try{const bytes=Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();const play=JSON.parse(text);if(!Array.isArray(play.steps))throw Error('Invalid play');return play;}catch(e){document.body.innerHTML='<main style="font:18px Arial;padding:40px"><h1>Unable to open this play</h1><p>The link may be incomplete. Ask your coach to copy and send the entire link.</p></main>';throw e}
}
const play=await loadPlayFromLink();const ns='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);const make=(parent,tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);parent.append(e);return e};let stepIndex=0,running=false,token=0;
 function markings(){const g=$('lines');g.replaceChildren();const path=d=>make(g,'path',{d});if(play.view==='full'){path('M28 28 H912 V572 H28 Z M470 28 V572 M28 99 H96 A192 192 0 0 1 96 501 H28 M912 99 H844 A192 192 0 0 0 844 501 H912 M28 215 H218 V385 H28 M912 215 H722 V385 H912 M218 215 A85 85 0 0 1 218 385 M722 215 A85 85 0 0 0 722 385 M54 260 V340 M886 260 V340');make(g,'circle',{cx:470,cy:300,r:77});make(g,'circle',{cx:78,cy:300,r:14});make(g,'circle',{cx:862,cy:300,r:14})}else{path('M28 28 H912 V572 H28 Z M104 28 V112 A372 372 0 0 0 836 112 V28 M367 28 V272 H573 V28 M367 272 A103 103 0 0 0 573 272 M418 69 H522 M370 572 A100 100 0 0 1 570 572');make(g,'circle',{cx:470,cy:103,r:17})}}
 function posAt(points,f){if(!points?.length)return{x:0,y:0};if(points.length===1)return points[0];let lengths=[],total=0;for(let i=1;i<points.length;i++){const d=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);lengths.push(d);total+=d}let d=Math.max(0,Math.min(1,f))*total;for(let i=0;i<lengths.length;i++){if(d<=lengths[i]||i===lengths.length-1){const t=lengths[i]?Math.min(1,d/lengths[i]):1;return{x:points[i].x+(points[i+1].x-points[i].x)*t,y:points[i].y+(points[i+1].y-points[i].y)*t}}d-=lengths[i]}return points.at(-1)}
 function groups(actions){const out=[];for(const a of actions||[]){if(a.together&&out.length)out.at(-1).push(a);else out.push([a])}return out}
 function draw(positions,ball,active=[],progress=0){const pg=$('players'),rg=$('routes');pg.replaceChildren();rg.replaceChildren();const st=play.steps[stepIndex];for(const a of active){if(!a.points||a.points.length<2)continue;const pts=a.points;const d='M'+pts.map(p=>p.x+' '+p.y).join(' L');const dash=a.type==='pass'?'12 10':a.type==='dribble'?'5 6':'';make(rg,'path',{d,fill:'none',stroke:a.type==='pass'?'#252525':'#85001e','stroke-width':Math.max(4,a.width||4),'stroke-dasharray':dash,opacity:.75})}for(const o of st.objects){const p=positions[o.id]||o;if(o.type==='cone'){make(pg,'path',{d:'M'+(p.x-11)+' '+(p.y+13)+'L'+p.x+' '+(p.y-16)+'L'+(p.x+11)+' '+(p.y+13)+'Z',fill:'#b11d26'});continue}const r=play.size||23;make(pg,'circle',{cx:p.x,cy:p.y,r:r+3,fill:'white'});make(pg,'circle',{cx:p.x,cy:p.y,r,fill:o.type==='def'?'#183f83':o.color||'#900021'});const t=make(pg,'text',{x:p.x,y:p.y+5,'font-size':17,'text-anchor':'middle','font-weight':'bold',fill:'white'});t.textContent=play.label==='name'?(o.name||o.num):play.label==='position'?o.pos:'#'+o.num;if(ball===o.id){make(pg,'circle',{cx:p.x+r*.8,cy:p.y-r*.8,r:12,fill:'#f9a322',stroke:'#853513','stroke-width':2})}}}
 function startPositions(){return Object.fromEntries(play.steps[stepIndex].objects.map(o=>[o.id,{x:o.x,y:o.y}]))}
 function renderNotes(){const root=$('instructions');root.replaceChildren();play.steps.forEach((st,i)=>{const h=document.createElement('h3');h.textContent='Step '+(i+1);root.append(h);const ol=document.createElement('ol');for(const a of st.actions||[]){const li=document.createElement('li');const from=st.objects.find(o=>o.id===a.from),to=st.objects.find(o=>o.id===a.to);li.textContent=(a.description||((from?'#'+from.num:'Player')+' '+({cut:'cuts / moves',pass:'passes',dribble:'dribbles',screen:'sets a screen',handoff:'hands off',shot:'shoots'}[a.type]||a.type)+(to?' to #'+to.num:'')))+(a.timing==='delay05'?' (Delay .5 sec)':a.timing==='delay1'?' (Delay 1 sec)':a.together?' (Together)':'');ol.append(li)}if(!ol.children.length){const p=document.createElement('p');p.textContent='Starting formation';root.append(p)}else root.append(ol);if(st.notes){const c=document.createElement('div');c.className='coaching';c.textContent=st.notes;root.append(c)}})}
 function renderStepList(){const root=$('steplist');root.replaceChildren();play.steps.forEach((st,i)=>{const b=document.createElement('button');b.className='stepitem'+(i===stepIndex?' active':'');b.textContent='Step '+(i+1);b.onclick=()=>{token++;running=false;stepIndex=i;$('play').textContent='▶ Play';display()};root.append(b);(st.actions||[]).forEach((a,j)=>{const el=document.createElement('div');el.className='actionitem';const player=st.objects.find(o=>o.id===a.from);el.textContent=(j+1)+'. '+(player?'#'+player.num+' ':'')+({pass:'Pass',cut:'Cut',screen:'Screen',dribble:'Dribble',handoff:'Handoff',shot:'Shot'}[a.type]||a.type)+(a.timing==='delay05'?' · Delay .5s':a.timing==='delay1'?' · Delay 1s':a.together?' · Together':'');root.append(el)})})} function display(){renderStepList();markings();draw(startPositions(),play.steps[stepIndex].ball);$('stepstatus').textContent='Step '+(stepIndex+1)+' of '+play.steps.length;$('previous').disabled=stepIndex===0;$('next').disabled=stepIndex===play.steps.length-1}
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function animate(){if(running)return;running=true;const mine=++token;$('play').textContent='Playing…';
 for(let si=stepIndex;si<play.steps.length&&mine===token;si++){
 stepIndex=si;display();const st=play.steps[si],positions=startPositions(),schedule=[];let ball=st.ball;
 for(const a of st.actions||[]){const prev=schedule.at(-1),mode=a.timing||(a.together?'together':'after'),duration=1000;const start=!prev?0:mode==='together'?prev.start:mode==='delay05'?prev.start+500:mode==='delay1'?prev.start+1000:prev.end;schedule.push({a,start,end:start+duration})}
 const total=Math.max(0,...schedule.map(item=>item.end)),started=performance.now();
 await new Promise(resolve=>{function frame(now){if(mine!==token){resolve();return}const elapsed=now-started,temp={...positions};let shownBall=st.ball;const active=[];
 for(const item of schedule){if(elapsed<item.start)continue;const a=item.a,f=Math.min(1,(elapsed-item.start)/(item.end-item.start));if(f<1)active.push(a);if(['cut','dribble','screen','handoff'].includes(a.type)&&a.from&&a.points?.length)temp[a.from]=posAt(a.points,f);if(f>=1){if(['pass','handoff'].includes(a.type))shownBall=a.to;if(a.type==='shot')shownBall=null}}
 draw(temp,shownBall,active);if(elapsed<total)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});
 if(si<play.steps.length-1&&mine===token)await sleep(500)
 }
 if(mine===token){running=false;$('play').textContent='▶ Play'} }
 $('title').textContent=play.name||'Basketball Play';$('play').onclick=()=>{stepIndex=0;animate()};$('restart').onclick=()=>{token++;running=false;stepIndex=0;$('play').textContent='▶ Play';display()};$('previous').onclick=()=>{token++;running=false;stepIndex=Math.max(0,stepIndex-1);$('play').textContent='▶ Play';display()};$('next').onclick=()=>{token++;running=false;stepIndex=Math.min(play.steps.length-1,stepIndex+1);$('play').textContent='▶ Play';display()};$('print').onclick=()=>window.print();$('downloadviewer').onclick=()=>{const blob=new Blob([document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(play.name||'Basketball_Play').replace(/[^a-z0-9_-]/gi,'_')+'_VIEW.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};renderNotes();display();})();</script></body></html>
